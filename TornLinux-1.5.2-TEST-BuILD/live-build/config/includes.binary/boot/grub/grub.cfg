set default="0"
set timeout_style=hidden
set timeout=0
set pager=0

menuentry "TornLinux Live" {
    linux /live/vmlinuz boot=live components quiet splash persistence username=tornuser loglevel=0 systemd.show_status=auto rd.udev.log_level=0 vt.global_cursor_default=0
    initrd /live/initrd.img
}

menuentry "TornLinux Live (No Persistence)" {
    linux /live/vmlinuz boot=live components quiet splash username=tornuser loglevel=0 systemd.show_status=auto rd.udev.log_level=0 vt.global_cursor_default=0
    initrd /live/initrd.img
}

menuentry "Install TornLinux" {
    linux /live/vmlinuz boot=live components quiet splash username=tornuser tornlinux_installer=1 loglevel=0 systemd.show_status=auto rd.udev.log_level=0 vt.global_cursor_default=0
    initrd /live/initrd.img
}
