set default="0"
set timeout=0
set pager=0
set menu_hide_ok=1
terminal_input console
terminal_output console

if [ x$feature_timeout_style = xy ]; then
    set timeout_style=hidden
fi

menuentry "TornLinux" {
    linux /live/vmlinuz boot=live components quiet splash rd.live.image root=live:CDLABEL=TornLinux-1.5.2 rd.live.dir=live rd.live.squashimg=filesystem.squashfs username=tornuser loglevel=0 systemd.show_status=auto rd.udev.log_level=0 vt.global_cursor_default=0
    initrd /live/initrd.img
}
